<div class="flex gap-3 overflow-x-auto pb-2">
  {% for column in columns %}
    <section class="card bg-base-100 shadow-sm w-56 shrink-0">
      <div class="card-body p-3">
        <h2 class="flex items-center justify-between text-sm font-semibold">
          {{ column.label }}
          <span class="badge badge-sm">{{ column.applications|length }}</span>
        </h2>
        <ul class="flex flex-1 flex-col gap-2 min-h-24" data-stage="{{ column.stage }}">
          {% for application in column.applications %}
            <li class="rounded-box bg-base-200 p-2 cursor-grab" data-move-url="{% url 'ats:application_move' application.pk %}">
              <p class="text-sm font-medium">{{ application.candidate }}</p>
              <p class="text-xs opacity-60 truncate">{{ application.candidate.email }}</p>
            </li>
          {% endfor %}
        </ul>
      </div>
    </section>
  {% endfor %}
</div>
